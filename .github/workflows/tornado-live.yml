name: Tornado Chaser live KTLX feed
on:
  schedule: [{cron: '*/15 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: tornado-live, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: {run: {working-directory: tornado-chaser/pipeline}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: tornado-chaser/pipeline/data/requirements.txt}
      - run: pip install -r data/requirements.txt
      - run: python -m data.fetch --site KTLX
      - run: python export_live.py data/out ../live.json
      - name: Commit live.json
        run: |
          git config user.name "tornado-chaser-bot"; git config user.email "actions@users.noreply.github.com"
          git add ../live.json
          git diff --cached --quiet || (git commit -m "Live KTLX feed $(date -u +%FT%TZ)" && git push)
